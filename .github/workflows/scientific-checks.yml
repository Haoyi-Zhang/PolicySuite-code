name: Offline scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sequential bounded offline finite replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scientific-output
          timeout --signal=TERM --kill-after=5s 720s python -B reproduce.py --output .scientific-output/replay > .scientific-output/replay.stdout.log 2> .scientific-output/replay.stderr.log
          timeout --signal=TERM --kill-after=5s 45s python -B src/audit_refinement.py > .scientific-output/refinement.stdout.log 2> .scientific-output/refinement.stderr.log
      - name: Retain actual raw outputs even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientific-raw
          path: .scientific-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
